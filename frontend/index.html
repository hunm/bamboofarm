<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambu Farm Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-panel">
            <h1>Bambu Farm <span>Manager</span></h1>
            <div class="actions">
                <button id="add-printer-btn" class="btn primary">Add Printer</button>
            </div>
        </header>

        <main>
            <section class="dashboard-section">
                <h2>Printers</h2>
                <div id="printers-grid" class="printers-grid">
                    <!-- Printers will be injected here via JS -->
                </div>
            </section>

            <section class="dashboard-section jobs-section">
                <div class="section-header">
                    <h2>Job Queue</h2>
                    <form id="upload-form" class="upload-form">
                        <label for="file-upload" class="btn secondary upload-btn">
                            Upload Print File
                            <input type="file" id="file-upload" accept=".3mf,.gcode" style="display:none;">
                        </label>
                    </form>
                </div>
                <div class="glass-panel">
                    <table id="jobs-table" class="jobs-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Filename</th>
                                <th>Printer</th>
                                <th>Progress</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="jobs-body">
                            <!-- Jobs will be injected here via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Printer Modal -->
    <div id="add-printer-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <h2>Add New Printer</h2>
            <form id="add-printer-form">
                <div class="form-group">
                    <label>Name (e.g. printer_1)</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>IP Address</label>
                    <input type="text" id="p-ip" required>
                </div>
                <div class="form-group">
                    <label>Serial Number</label>
                    <input type="text" id="p-serial" required>
                </div>
                <div class="form-group">
                    <label>Access Code</label>
                    <input type="text" id="p-code" required>
                </div>
                <button type="submit" class="btn primary">Add</button>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
