esphome:
  name: bambu-button-1
  platform: ESP8266
  board: nodemcuv2

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

mqtt:
  broker: "192.168.1.100" # IP of your Farm MQTT Broker (the Python Server)
  port: 1883
  # username: "user"
  # password: "password"

# Define the physical button (e.g., connected to D1 / GPIO5)
binary_sensor:
  - platform: gpio
    pin:
      number: D1
      mode: INPUT_PULLUP
      inverted: true
    name: "Clean Confirm Button"
    id: clean_button
    on_press:
      - mqtt.publish:
          topic: farm/printer_1/button
          payload: "PRESSED"
      # Optional: flash LED to confirm press
      - light.turn_on:
          id: status_led
          flash_length: 200ms

# Optional: Status LED (e.g., connected to D2 / GPIO4)
light:
  - platform: binary
    name: "Status LED"
    id: status_led
    pin: D2
